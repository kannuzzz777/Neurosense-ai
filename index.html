<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Prediction</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS file -->
</head>
<body>
    <div class="container">
        <h1>Disease Prediction Model</h1>
        <p>Enter your symptoms below to get a predicted disease.</p>
        
        <textarea id="symptomInput" placeholder="e.g., I have a headache and a fever." rows="5"></textarea>
        <button id="predictButton">Predict Disease</button>
        
        <div id="predictionResult">
            <!-- Predicted disease will be displayed here -->
        </div>
        
        <div class="disclaimer">
            <p>Disclaimer: This prediction is based on a limited dataset and is for informational purposes only. Consult a medical professional for accurate diagnosis and treatment.</p>
        </div>
    </div>

    <script src="script.js"></script> <!-- Link to JavaScript file -->
</body>
</html>
